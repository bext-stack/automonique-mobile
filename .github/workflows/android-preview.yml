name: Android preview artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PREVIEW_APK_NAME: automonique-mobile-0.1.0-preview.3.apk
      PREVIEW_OUTPUT_DIR: ${{ github.workspace }}/preview-output
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: 36.0.0
      ANDROID_NDK: 27.1.12297006
      # Expo's generated 2 GiB default is insufficient for the universal APK's
      # final D8 merge. Keep the governed runner budget explicit and bounded.
      PREVIEW_GRADLE_JVM_ARGS: -Xmx4608m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

    steps:
      - name: Check out the selected protected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce protected-main source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up exact Temurin JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          # Adoptium's canonical SemVer for release jdk-21.0.12.1+1.
          java-version: 21.0.12+101.0.LTS
          force-download: true
          verify-signature: true

      - name: Set up exact npm and evidence directories
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.10.1 --ignore-scripts
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 11.10.1
          java -version 2>&1 | tee java-version.txt
          grep -F 'Temurin-21.0.12.1+1' java-version.txt
          rm java-version.txt
          work_dir="$RUNNER_TEMP/automonique-android-preview"
          echo "PREVIEW_WORK_DIR=$work_dir" >> "$GITHUB_ENV"
          echo "PREVIEW_MAVEN_RAW=$work_dir/maven-raw.json" >> "$GITHUB_ENV"
          mkdir -p "$PREVIEW_OUTPUT_DIR" "$work_dir"

      - name: Install locked JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$PREVIEW_OUTPUT_DIR/npm-ci.txt"

      - name: Run complete repository validation
        shell: bash
        run: |
          set -euo pipefail
          npm run validate 2>&1 | tee "$PREVIEW_OUTPUT_DIR/npm-validate.txt"

      - name: Preserve an explicit native-policy result
        shell: bash
        run: |
          set -euo pipefail
          npm run native:verify 2>&1 | tee "$PREVIEW_OUTPUT_DIR/native-policy.txt"

      - name: Generate a clean Android native project
        shell: bash
        run: |
          set -euo pipefail
          CI=1 npx expo prebuild --platform android --clean --no-install 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/expo-prebuild.txt"
          node scripts/android-preview-evidence.mjs prepare-native 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/native-preparation.txt"

      - name: Install exact official Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --install \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            platform-tools \
            "ndk;$ANDROID_NDK" \
            emulator \
            "system-images;android-36;google_apis;x86_64" 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/android-sdk-install.txt"
          "$sdkmanager" --list_installed 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/android-sdk-packages.txt"
          test -x "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          test -f "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK/source.properties"
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          test -f "$ANDROID_SDK_ROOT/system-images/android-36/google_apis/x86_64/source.properties"

      - name: Install and record the Android emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/ubuntu-apt-update.txt"
          sudo apt-get install --yes --no-install-recommends libpulse0 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/ubuntu-emulator-runtime-install.txt"
          dpkg-query --show --showformat='${Package}=${Version}\n' libpulse0 \
            | tee "$PREVIEW_OUTPUT_DIR/ubuntu-emulator-runtime-packages.txt"
          ldd "$ANDROID_SDK_ROOT/emulator/emulator" \
            | tee "$PREVIEW_OUTPUT_DIR/android-emulator-ldd.txt"
          if grep -F 'not found' "$PREVIEW_OUTPUT_DIR/android-emulator-ldd.txt"; then
            exit 1
          fi
          "$ANDROID_SDK_ROOT/emulator/emulator" -version 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/android-emulator-version.txt"

      - name: Build the credential-free universal release APK
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon --console=plain --stacktrace \
            "-Dorg.gradle.jvmargs=$PREVIEW_GRADLE_JVM_ARGS" \
            :app:assembleRelease 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/gradle-assemble-release.txt"

      - name: Generate Maven dependency and license evidence
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon --console=plain \
            :app:dependencies --configuration releaseRuntimeClasspath 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/maven-dependency-tree.txt"
          ./android/gradlew -p android --no-daemon --console=plain \
            -I "$GITHUB_WORKSPACE/scripts/android-preview-inventory.init.gradle" \
            :app:previewRuntimeInventory 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/maven-inventory-generation.txt"

      - name: Fail closed on APK, signing, provenance, and licenses
        shell: bash
        run: |
          set -euo pipefail
          node scripts/android-preview-evidence.mjs verify-artifact 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/artifact-verification.txt"

      - name: Install and smoke-test the exact universal APK on an emulator
        shell: bash
        run: |
          set -euo pipefail
          apk="$PREVIEW_OUTPUT_DIR/$PREVIEW_APK_NAME"
          avdmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          emulator="$ANDROID_SDK_ROOT/emulator/emulator"
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          export ANDROID_AVD_HOME="$PREVIEW_WORK_DIR/avd"
          avd_name=automonique-preview
          test -f "$apk"
          apk_sha_before="$(sha256sum "$apk" | awk '{ print $1 }')"
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" \
            | tee "$PREVIEW_OUTPUT_DIR/emulator-avd-environment.txt"

          printf 'no\n' | "$avdmanager" create avd --force \
            --name "$avd_name" \
            --path "$ANDROID_AVD_HOME/$avd_name.avd" \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device pixel_6 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/emulator-avd-creation.txt"
          test -f "$ANDROID_AVD_HOME/$avd_name.ini"
          test -d "$ANDROID_AVD_HOME/$avd_name.avd"
          grep -Fx "path=$ANDROID_AVD_HOME/$avd_name.avd" \
            "$ANDROID_AVD_HOME/$avd_name.ini"
          "$avdmanager" list avd 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/emulator-avd-manager-list.txt"
          "$emulator" -list-avds \
            | tee "$PREVIEW_OUTPUT_DIR/emulator-avd-list.txt"
          test "$(wc -l < "$PREVIEW_OUTPUT_DIR/emulator-avd-list.txt")" -eq 1
          grep -Fx "$avd_name" "$PREVIEW_OUTPUT_DIR/emulator-avd-list.txt"

          emulator_console="$PREVIEW_OUTPUT_DIR/emulator-console.txt"
          "$emulator" -avd "$avd_name" -accel on -gpu software \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -no-metrics -camera-back none -memory 4096 -cores 4 \
            > "$emulator_console" 2>&1 &
          emulator_pid=$!
          emulator_cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo '--- Android emulator failure diagnostics ---'
              "$adb" devices -l || true
              tail -n 240 "$emulator_console" || true
            fi
            kill "$emulator_pid" 2>/dev/null || true
            trap - EXIT
            exit "$status"
          }
          trap emulator_cleanup EXIT

          booted=false
          for _attempt in $(seq 1 180); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Android emulator exited before completing boot.' >&2
              exit 1
            fi
            if "$adb" shell getprop sys.boot_completed 2>/dev/null \
              | grep -qx 1; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            echo 'Android emulator did not complete boot within 360 seconds.' >&2
            exit 1
          fi

          "$adb" install --no-streaming -r "$apk" 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/emulator-install.txt"
          "$adb" logcat -c
          "$adb" shell am force-stop dev.bext.automonique
          "$adb" shell am start -W \
            dev.bext.automonique/.MainActivity 2>&1 \
            | tee "$PREVIEW_OUTPUT_DIR/emulator-launch.txt"

          rendered=false
          for _attempt in $(seq 1 30); do
            "$adb" shell uiautomator dump /sdcard/automonique-window.xml \
              >/dev/null 2>&1 || true
            "$adb" pull /sdcard/automonique-window.xml \
              "$PREVIEW_OUTPUT_DIR/emulator-window.xml" >/dev/null 2>&1 || true
            if grep -F 'text="Connect your server"' \
              "$PREVIEW_OUTPUT_DIR/emulator-window.xml" >/dev/null 2>&1 \
              && grep -F 'text="Check your server"' \
                "$PREVIEW_OUTPUT_DIR/emulator-window.xml" >/dev/null 2>&1; then
              rendered=true
              break
            fi
            sleep 2
          done
          test "$rendered" = true
          test -n "$("$adb" shell pidof dev.bext.automonique)"
          "$adb" logcat -d -v threadtime \
            > "$PREVIEW_OUTPUT_DIR/emulator-logcat.txt"
          "$adb" shell dumpsys activity exit-info dev.bext.automonique \
            > "$PREVIEW_OUTPUT_DIR/emulator-exit-info.txt"

          apk_sha_after="$(sha256sum "$apk" | awk '{ print $1 }')"
          test "$apk_sha_after" = "$apk_sha_before"
          printf '%s  %s\n' "$apk_sha_after" "$PREVIEW_APK_NAME" \
            > "$PREVIEW_OUTPUT_DIR/emulator-tested-apk.sha256"
          "$adb" emu kill || true
          wait "$emulator_pid" || true
          trap - EXIT

      - name: Attest the exact verified APK
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PREVIEW_OUTPUT_DIR }}/${{ env.PREVIEW_APK_NAME }}

      - name: Preserve the GitHub attestation bundle
        shell: bash
        env:
          PREVIEW_ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PREVIEW_ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          PREVIEW_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          node scripts/android-preview-evidence.mjs record-attestation

      - name: Upload the exact APK and retained evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-preview-${{ github.sha }}
          path: ${{ env.PREVIEW_OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Summarize retained artifact
        shell: bash
        env:
          PREVIEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PREVIEW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PREVIEW_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo '## Android preview evidence'
            echo
            echo "- Source: \`$GITHUB_SHA\` on protected \`main\`"
            echo "- Retained artifact ID: \`$PREVIEW_ARTIFACT_ID\`"
            echo "- Artifact archive digest: \`$PREVIEW_ARTIFACT_DIGEST\`"
            echo "- Artifact URL: $PREVIEW_ARTIFACT_URL"
            echo '- Distribution: public, non-production Android preview only'
            echo '- This run creates no tag or release and establishes no live acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
